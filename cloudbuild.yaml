# Build image cho Cloud Run.
#
# Dockerfile nằm ở infra/ nên phải chỉ định -f; build context là gốc repo vì
# image cần cả apps/ lẫn packages/.
#
# Cấu hình Firebase phía trình duyệt được nhúng vào bundle lúc build (Next.js
# thay thế NEXT_PUBLIC_* ở thời điểm biên dịch), nên phải truyền vào đây chứ
# không đặt được ở biến môi trường của Cloud Run. Đây là giá trị công khai:
# chúng định danh project Firebase, không cấp quyền truy cập dữ liệu.
#
# scripts/deploy-cloudshell.sh tự đọc các giá trị này từ Secret Manager.

substitutions:
  _IMAGE: ''
  _FB_API_KEY: ''
  _FB_AUTH_DOMAIN: ''
  _FB_PROJECT_ID: ''
  _FB_STORAGE_BUCKET: ''
  _FB_MESSAGING_SENDER_ID: ''
  _FB_APP_ID: ''

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infra/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'

images:
  - '${_IMAGE}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  # Build chạy bằng service account mặc định của project, vốn không có bucket
  # log riêng; ghi thẳng vào Cloud Logging để tránh lỗi thiếu bucket.
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
